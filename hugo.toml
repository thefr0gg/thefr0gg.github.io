baseURL = 'https://thefr0gg.github.io/'
languageCode = 'en-us'
title = "thefr0gg"
theme = "enervoid-theme"
enableRobotsTXT = true

[taxonomies]
  series = 'series'
  tag = 'tags'

[menus]
  [[menus.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 10

  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 20

[params]
  avatar = "/images/profile-picture/avatar.jpg"
  description = "thefr0gg. Computer wizard"

  [[params.socials]]
    link = "https://github.com/thefr0gg"
    icon = "devicon-github-original"
  [[params.socials]]
    link = "https://youtube.com/@ramsy0dev"
    icon = "devicon-youtube-plain"
  [[params.socials]]
    link = "https://tryhackme.com/p/ramsy0dev"
    icon = "fa-brands fa-tryhackme"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$','$$'], ['\[','\]']]
        inline = [['$','$'], ['\(','\)']]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[markup.highlight]
  noClasses = true
  codeFences = true
  guessSyntax = true
  tabWidth = 4
  style = "monokai"
